[package]
name = "memweave"
version = "0.1.0-alpha.1"
edition = "2024"
description = "Experimental and unstable: model-driven knowledge graph retrieval that returns a tree of knowledge nodes"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["knowledge-graph", "retrieval", "llm", "memory"]
categories = ["command-line-utilities"]
# 白名单：只打包列出的文件，避免把本地的密钥或笔记带进发布包。
include = ["/src/**/*.rs", "/build.rs", "/cpp/**", "/examples/demo-kb/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE*"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
ureq = "3.5.0"

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
cc = "1.10.0"
